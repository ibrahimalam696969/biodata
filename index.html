<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibrahim | Creative Tech, Gaming & Showcase</title>

    <!-- PRELOAD HIGH PRIORITY ASSETS -->
    <link rel="preload" as="image" href="IMG_20260225_150531614.jpg">
    <link rel="preload" as="image" href="2.jpg">

    <style>
        /* VARIABLES FOR DARK/LIGHT / THEMES */
        :root {
            --bg-color: #0d0f18;
            --text-color: #f3f4f6;
            --header-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-card-bg: rgba(20, 24, 38, 0.55);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-blur: 16px;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f;
            --accent-purple: #7928ca;
            --accent-green: #00ff88;
            --invert-val: 0;
            --scanline-display: none;
        }

        [data-theme="terminal"] {
            --bg-color: #030a06;
            --text-color: #00ff66;
            --header-color: #00ff66;
            --glass-bg: rgba(0, 255, 102, 0.05);
            --glass-card-bg: rgba(5, 20, 10, 0.7);
            --glass-border: rgba(0, 255, 102, 0.3);
            --accent-cyan: #00ff66;
            --accent-pink: #00ff66;
            --invert-val: 1;
            --scanline-display: block;
        }

        /* FULLSCREEN BACKGROUND ANIMATION CANVAS */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
            display: none;
        }

        /* CRT SCANLINE SHIELD EFFECT */
        .crt-overlay {
            display: var(--scanline-display);
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 4px, 6px 100%;
            z-index: 99999;
            pointer-events: none;
        }

        /* RGB ANIMATED BACKGROUND */
        @keyframes rgbCanvasAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.rgb-active {
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1f4037, #99f2c8, #0d0f18) !important;
            background-size: 400% 400% !important;
            animation: rgbCanvasAnimation 10s ease infinite !important;
        }

        @keyframes actualWave {
            0% { transform: rotate(0deg); }
            15% { transform: rotate(16deg); }
            30% { transform: rotate(-10deg); }
            45% { transform: rotate(16deg); }
            60% { transform: rotate(-5deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }

        .waving-animation { animation: actualWave 1.1s ease-in-out; }

        /* BASE STYLES */
        * { box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px 60px 20px;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(121, 40, 202, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
        }

        .container { max-width: 860px; margin: 0 auto; }

        /* BUTTONS */
        .glass-btn, .about-btn, .theme-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px 22px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .glass-btn:hover, .about-btn:hover, .theme-btn:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.25);
            color: #fff;
        }

        .glass-btn:active, .about-btn:active { transform: scale(0.97); }

        /* FLOATING ACTION WIDGETS */
        .draggable-widget {
            position: fixed;
            width: 58px; height: 58px;
            background: rgba(20, 24, 38, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            z-index: 10000;
            user-select: none;
            touch-action: none;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .draggable-widget:hover {
            transform: scale(1.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
        }

        .draggable-widget.active-widget {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green);
        }

        #gameWidgetBtn { bottom: 25px; right: 25px; }
        #musicWidgetBtn { bottom: 25px; right: 95px; }
        #colorWidgetBtn { bottom: 25px; right: 165px; }

        /* MODAL GLASS PANELS */
        .arcade-panel-box {
            position: fixed;
            width: 440px;
            max-width: calc(100% - 30px);
            background: var(--glass-card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        #arcadePanel { bottom: 95px; right: 25px; }
        #musicPanel { bottom: 95px; right: 75px; }
        #colorPanel { bottom: 95px; right: 125px; width: 380px; }

        .arcade-panel-box.show {
            display: block;
            animation: panelFadeIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .panel-ui-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            font-weight: 700;
            display: flex; justify-content: space-between; align-items: center;
            cursor: move;
            border-bottom: 1px solid var(--glass-border);
            user-select: none;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .panel-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-ui-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .panel-ui-close:hover { background: var(--accent-pink); }

        .color-panel-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 480px;
            overflow-y: auto;
        }

        .color-search-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 8px 14px;
        }

        .color-search-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
        }

        .swatches-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .swatch-btn {
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .swatch-btn:hover {
            transform: scale(1.02);
            border-color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.15);
        }

        .game-tabs-nav {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--glass-border);
            overflow-x: auto;
            padding: 6px;
            gap: 6px;
        }

        .game-tab-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.65);
            border: none;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .game-tab-btn.active {
            background: var(--glass-bg);
            color: #fff;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2);
        }

        .arcade-box-body {
            padding: 16px;
            text-align: center;
            color: #fff;
            max-height: 480px;
            overflow-y: auto;
        }

        .canvas-container {
            display: inline-block;
            background: #000;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            line-height: 0;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #arcadeCanvas { display: block; max-width: 100%; height: auto; }

        .arcade-controls {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 40px);
            gap: 6px;
            justify-content: center;
        }

        .arcade-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid var(--glass-border);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            user-select: none;
            transition: 0.15s;
        }
        .arcade-btn:active { transform: scale(0.92); background: var(--accent-cyan); color: #000; }

        #puzzleGrid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-gap: 8px;
            justify-content: center;
            margin: 15px auto;
        }

        .puzzle-tile {
            width: 80px;
            height: 80px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .puzzle-tile.empty {
            background: transparent;
            border: 1px dashed rgba(255,255,255,0.2);
            cursor: default;
        }

        .browser-navigation-bar {
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--glass-border);
            padding: 8px 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .browser-url-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 8px;
            outline: none;
        }

        .browser-viewport-wrapper {
            background: #000;
            line-height: 0;
            height: 352px;
        }
        #guestSpotifyPlayer { border: none; width: 100%; height: 100%; }

        /* GLASS CONTENT CARDS */
        .project-card, .timeline-item, blockquote, footer, .info-panel { 
            background: var(--glass-card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            padding: 24px;
            margin: 24px 0;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            color: var(--text-color);
            content-visibility: auto;
            contain-intrinsic-size: 450px;
        }

        .project-card:hover, .timeline-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 242, 254, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .info-panel { display: none; max-width: 540px; margin: 20px auto; text-align: left; }
        .info-panel.show { display: block; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px; margin-top: 20px;
        }

        .skill-tag {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            border-radius: 14px;
        }

        /* HARDWARE ACCELERATED PHOTO WRAPPER */
        .photo-wrapper {
            position: relative;
            display: block;
            width: 100%;
            margin-top: 15px;
            border-radius: 16px;
            overflow: hidden;
            line-height: 0;
            background: rgba(10, 14, 25, 0.5);
            transform: translateZ(0);
        }

        .photo-wrapper img {
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            filter: invert(var(--invert-val));
            display: block;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--header-color);
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 70%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        h2 { font-size: 1.8rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; margin-top: 50px; color: var(--header-color); }
        .subtitle { font-size: 1.15rem; color: rgba(255,255,255,0.8); font-weight: 500; }

        .status-badge {
            display: inline-flex; align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            margin-top: 15px;
        }

        .status-dot {
            width: 8px; height: 8px; background-color: var(--accent-green);
            border-radius: 50%; margin-right: 10px;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .chapter-heading {
            font-size: 1.35rem;
            color: var(--accent-cyan);
            margin-top: 45px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-cyan);
            padding-left: 12px;
            letter-spacing: 0.5px;
        }

        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }
        footer a:hover {
            text-decoration: underline;
            color: var(--accent-pink);
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            body { padding: 25px 12px 60px 12px; }
            h1 { font-size: 2.2rem; }
            .project-card, .timeline-item {
                backdrop-filter: blur(8px) !important;
                -webkit-backdrop-filter: blur(8px) !important;
                padding: 16px;
            }
            .arcade-panel-box { width: calc(100% - 24px); }
            #arcadePanel, #musicPanel, #colorPanel { right: 12px; left: 12px; width: auto; }
        }
    </style>
</head>
<body>

    <!-- FULLSCREEN BACKGROUND CANVAS -->
    <canvas id="bgCanvas"></canvas>
    <div class="crt-overlay"></div>

    <!-- FLOATING ACTION WIDGETS -->
    <div id="colorWidgetBtn" class="draggable-widget" title="Toggle FX & Background [Key: C]">🎨</div>
    <div id="musicWidgetBtn" class="draggable-widget" title="Toggle Spotify Music [Key: M]">🎵</div>
    <div id="gameWidgetBtn" class="draggable-widget" title="Toggle Arcade Hub [Key: G]">🎮</div>

    <!-- 1. COLOR & ANIMATION ENGINE POPUP PANEL -->
    <div id="colorPanel" class="arcade-panel-box" onclick="focusPanel(this)">
        <div class="panel-ui-header" id="colorHeader">
            <span>🎨 FX & COLOR_CORE.EXE</span>
            <div class="panel-header-actions">
                <button class="panel-ui-close" onclick="toggleColorPanel()" title="Minimize">_</button>
            </div>
        </div>
        <div class="color-panel-body">
            <p style="font-size: 0.85rem; opacity: 0.8; margin: 0;">Type any color (e.g. <i>crimson, #0d0f18</i>) or <b>'rgb'</b>:</p>
            <div class="color-search-wrapper">
                <input type="text" id="colorSearchInput" placeholder="Enter color name or code..." autocomplete="off">
            </div>

            <p style="font-size: 0.82rem; font-weight: bold; opacity: 0.9; margin: 6px 0 0 0;">Dynamic Animated Backgrounds:</p>
            <div class="swatches-grid">
                <button class="swatch-btn" onclick="startBgAnimation('matrix')">💻 Green Binary Hacker</button>
                <button class="swatch-btn" onclick="startBgAnimation('coins')">🪙 Falling Gold Coins</button>
                <button class="swatch-btn" onclick="startBgAnimation('rain')">🌧️ Cyber Storm Rain</button>
                <button class="swatch-btn" onclick="startBgAnimation('cars')
